# Force tmux server config (socket: tmux -L force). See docs/SPEC.md §10.
# Only Force bindings exist; there is no prefix key: Ctrl+Space opens the Force menu (SPEC §44).

unbind -aq
unbind -aq -T root
# No prefix key. Ctrl+Space (and Ctrl+\, for those used to it) opens the Force menu at once, every action with
# its letter (SPEC §44). The menu is tmux config loaded with source-file, so it is open before tmux reads the
# next key: Ctrl+Space n always reaches the menu, never the session.
set -g prefix None
set -g prefix2 None
bind -n C-Space source-file -F "#{@force_app}/share/menu-classic.tmux"
bind -n 'C-\' source-file -F "#{@force_app}/share/menu-classic.tmux"

# --- terminal fidelity for Claude Code ---------------------------------------
set -g default-terminal "tmux-256color"
# fixed indices (after tmux's own 0-2), so a config reload replaces them instead of appending copies
set -s terminal-features[10] "xterm*:RGB:extkeys:clipboard:hyperlinks:usstyle:focus:sync"
set -s terminal-features[11] "alacritty*:RGB:extkeys:clipboard:hyperlinks:usstyle:focus:sync"
set -s terminal-features[12] "*kitty*:RGB:extkeys:clipboard:hyperlinks:usstyle:focus:sync"
# a nested client (the ui server of split mode, SPEC §39) is itself a tmux
set -s terminal-features[13] "tmux*:RGB:extkeys:clipboard:hyperlinks:usstyle:focus:sync"
set -s extended-keys on
# Shift+Enter / Ctrl+Enter: a new line (Ctrl+J) in Claude Code, OpenCode and editors, a plain Enter in a
# shell. tmux 3.4 cannot hand them to apps that did not ask for extended keys (Ctrl+Enter was dropped). The
# new line is Alt+Enter or Ctrl+J in every terminal; Shift+Enter / Ctrl+Enter only where the terminal sends
# them by itself.
bind -n S-Enter send-keys C-j
bind -n C-Enter send-keys C-j
set -s escape-time 0
set -s set-clipboard on
# The ui tmux (split mode) or the terminal (OSC 52) puts copies on the clipboard.
set -g focus-events on
set -g allow-passthrough on
set -g mouse on
set -g history-limit 100000
set -g remain-on-exit on
set -g detach-on-destroy off
# Several terminals may be attached. A session shown in two terminals at once takes the smaller size and
# keeps it (`latest` resized it back and forth with every keystroke in either terminal, and Claude Code
# redraws its whole screen on each resize); hidden windows are pre-sized by presize.sh (SPEC §26).
set -g window-size smallest
set -g destroy-unattached off
set -g exit-empty off
set -g base-index 0
set -g pane-base-index 0
set -g set-titles on
set -g set-titles-string "Force · #S"
set -g @force_sidebar on
# The force launcher the menus and keys run (SPEC §2.1): FORCE_BIN from the process that started this server (a
# development instance's launcher), else the live install's.
%if "#{==:$FORCE_BIN,}"
set-environment -g FORCE_BIN "$HOME/.local/bin/force"
%endif
# Header files dir; the daemon overrides this with its FORCE_STATE at start-up.
%if "#{==:#{@force_app},}"
set -g @force_app "$HOME/.local/share/force/app"
%endif
%if "#{==:#{@force_state},}"
set -g @force_state "$HOME/.local/state/force"
%endif
set-environment -g COLORTERM truecolor

# Force theme (SPEC §45): painted by tmux, so any truecolor terminal looks the same.
set -g window-style "fg=#d0d0d0,bg=#262626"
set -g window-active-style "fg=#d0d0d0,bg=#262626"
set -g cursor-colour "#d97757"
set -g pane-colours[0] "#000000"
set -g pane-colours[1] "#cc0403"
set -g pane-colours[2] "#19cb00"
set -g pane-colours[3] "#cecb00"
set -g pane-colours[4] "#0d73cc"
set -g pane-colours[5] "#cb1ed1"
set -g pane-colours[6] "#0dcdcd"
set -g pane-colours[7] "#dddddd"
set -g pane-colours[8] "#767676"
set -g pane-colours[9] "#f2201f"
set -g pane-colours[10] "#23fd00"
set -g pane-colours[11] "#fffd00"
set -g pane-colours[12] "#1a8fff"
set -g pane-colours[13] "#fd28ff"
set -g pane-colours[14] "#14ffff"
set -g pane-colours[15] "#ffffff"

# --- header (rendered by the cockpit daemon) --------------------------------------
# No tmux status line: the header is a 2-row pane (`force-header`) above the agent, beside the
# full-height sidebar. The status-format lines below are inert while status is off.
set -g status off
set -g status-position top
set -g status-interval 1
set -g status-style "bg=colour235,fg=colour250"
set -g status-format[0] "#(cat #{@force_state}/header/#{session_name}.txt 2>/dev/null || echo ' force │ #{session_name} │ daemon not running')"
set -g status-format[1] "#(cat #{@force_state}/header/#{session_name}.sub.txt 2>/dev/null)"
# Toasts, popups and copy mode in the cockpit palette (theme.py): greys + coral, no blue/yellow.
set -g message-style "bg=colour236,fg=colour252"
set -g message-command-style "bg=colour236,fg=colour252"
set -g mode-style "bg=colour239,fg=colour255"
set -g popup-style "bg=#212121"   # menus and popups in the shell colour, so they stand off the agent panes
set -g popup-border-style "fg=#4e4e4e,bg=#212121"   # the cards' light grey (force/cards.py)
set -g popup-border-lines rounded
set -g menu-style "bg=#212121,fg=#c6c6c6"
set -g menu-selected-style "bg=#363636,fg=#ffffff,bold"
set -g menu-border-style "fg=#4e4e4e,bg=#212121"
set -g menu-border-lines rounded
set -g display-time 3000
set -g pane-border-style "fg=#212121,bg=#212121"   # drawn in the shell colour: sidebar, header and these form one frame
set -g pane-active-border-style "fg=#212121,bg=#212121"
set -g remain-on-exit-format " the session exited (#{?pane_dead_signal,signal #{pane_dead_signal},status #{pane_dead_status}}) — Ctrl+Space then x restarts, a archives "

# --- switching (no prefix) -----------------------------------------------------
# The daemon maintains @force_idx_N (server) and @force_next / @force_prev (per session). Alt+PgUp/PgDn reach tmux
# in every terminal; Tilix and Terminator keep Alt+1…9 / Alt+arrows for their own panes (SPEC §44).
bind -n M-1 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_1}" 2>/dev/null || true'
bind -n M-2 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_2}" 2>/dev/null || true'
bind -n M-3 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_3}" 2>/dev/null || true'
bind -n M-4 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_4}" 2>/dev/null || true'
bind -n M-5 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_5}" 2>/dev/null || true'
bind -n M-6 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_6}" 2>/dev/null || true'
bind -n M-7 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_7}" 2>/dev/null || true'
bind -n M-8 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_8}" 2>/dev/null || true'
bind -n M-9 run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_idx_9}" 2>/dev/null || true'
bind -n M-Down run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_next}" 2>/dev/null || true'
bind -n M-Up   run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_prev}" 2>/dev/null || true'
bind -n M-NPage run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_next}" 2>/dev/null || true'
bind -n M-PPage run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{@force_prev}" 2>/dev/null || true'

# Click a header tab.
# Click a header chip (switch), the sidebar button (range __sidebar__: toggle the sidebar
# everywhere) or the quit button (range __quit__: detach, sessions keep running).
bind -n MouseDown1Status {
  if -F "#{==:#{mouse_status_range},__sidebar__}" {
    run-shell -b "#{@force_app}/share/sidebar-toggle.sh '#{socket_path}' '#{window_id}'"
  } {
    if -F "#{==:#{mouse_status_range},__quit__}" {
      detach-client
    } {
      run-shell 'tmux -S "#{socket_path}" switch-client -c "#{client_name}" -t "=#{mouse_status_range}" 2>/dev/null || true'
    }
  }
}
# Mouse in panes: click focuses, wheel scrolls (copy-mode when the app does not take the mouse).
# A click in the sidebar or header goes there without making it the active pane (keyboard focus and
# its cursor stay out of the way; the sidebar switches sessions itself). Elsewhere: focus + click.
# A click on a pane's menu button (the header's controls, the sidebar's host chip: the pane publishes the cell
# rectangle as @force_menu_kind/_x0/_x1/_y0/_y1) opens that menu from here, with the click (share/menu.sh): it stays
# open, its items take clicks, a click outside (the button again too) closes it. Other clicks go to the pane.
bind -n MouseDown1Pane if -F "#{&&:#{@force_menu_kind},#{&&:#{&&:#{e|>=|:#{mouse_x},#{@force_menu_x0}},#{e|<|:#{mouse_x},#{@force_menu_x1}}},#{&&:#{e|>=|:#{mouse_y},#{@force_menu_y0}},#{e|<|:#{mouse_y},#{@force_menu_y1}}}}}" {
  if -F "#{==:#{@force_menu_kind},controls}" {
    source-file -F "#{@force_app}/share/menu-classic.tmux"
  } {
    run-shell "'#{@force_app}/share/menu.sh' '#{@force_menu_kind}' '#{socket_path}' '#{client_name}' '#{window_id}' '#{socket_path}.menu-#{client_pid}'"
    source-file -qF "#{socket_path}.menu-#{client_pid}"
  }
} {
  if -F "#{||:#{==:#{@force_role},sidebar},#{==:#{@force_role},header}}" "send-keys -M" "select-pane -t = ; send-keys -M"
}
bind -n WheelUpPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane send-keys -M
bind -n MouseDrag1Pane if -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -M"
# Copy mode (a shell's drag selection, wheel scrollback): the selection stays, right click copies, typing goes
# back to the shell (SPEC §44; generated by force/menus.py).
source-file -qF "#{@force_app}/share/copy-mode.tmux"

# --- keep the sidebar at its fixed width (tmux resizes panes proportionally) -----
# The daemon also enforces this every tick; these hooks make it immediate.
set-hook -g window-resized 'run-shell -b "#{@force_app}/share/fit.sh \"#{socket_path}\" \"#{hook_window}\""'
set-hook -g client-session-changed 'run-shell -b "#{@force_app}/share/switched.sh \"#{socket_path}\" \"#{client_session}\" \"#{client_last_session}\" \"#{client_name}\"; #{@force_app}/share/presize.sh \"#{socket_path}\" \"#{client_name}\""'
set-hook -g client-attached 'run-shell -b "#{@force_app}/share/switched.sh \"#{socket_path}\" \"#{client_session}\" \"\" \"#{client_name}\"; #{@force_app}/share/presize.sh \"#{socket_path}\" \"#{client_name}\""'
# A detaching client may leave a session to terminals of one kind again: recompute its glyph tier.
set-hook -g client-detached 'run-shell -b "#{@force_app}/share/tier.sh \"#{socket_path}\" \"#{client_session}\" --signal"'
# Pre-size the windows nobody is looking at to this client's size, so switching to them never resizes (and
# never makes Claude Code redraw its whole screen). SPEC §26.
set-hook -g client-resized 'run-shell -b "#{@force_app}/share/presize.sh \"#{socket_path}\" \"#{client_name}\""'
