[package]
name = "force-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Force's single entry point to a remote host: ssh, or a direct QUIC link when one is up (SPEC §56)"

[dependencies]
# default features off: no relay client defaults, no port mapping, no metrics (SPEC §56.2)
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
