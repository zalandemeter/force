# The development image (build/dev/Dockerfile) -> ghcr.io/zalandemeter/force-dev: :latest from main, and :<commit>.
# scripts/devbox.sh and .devcontainer/ use it. Pull requests that change it only build it.
name: Dev image

on:
  push:
    branches: [main]
    paths: [build/dev/**, .github/workflows/dev-image.yml]
  pull_request:
    paths: [build/dev/**, .github/workflows/dev-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/force-dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: build/dev
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Force development image: Python, pytest, tmux, Rust
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
