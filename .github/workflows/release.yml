# A tag vX.Y.Z (matching pyproject.toml's version) builds the release tarballs (Linux in the builder container, macOS
# on a GitHub Mac, SPEC §51), attests their provenance, publishes a GitHub Release with the tarballs, their .sha256
# and install.sh (pinning every platform's SHA), then redeploys the website (on main) so
# https://useforce.cc/install.sh installs the new version.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  darwin:
    name: macOS tarball
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches pyproject.toml
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$v\"" pyproject.toml \
            || { echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml has $(grep -m1 '^version' pyproject.toml)"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          scripts/build-darwin.sh "$VERSION"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/out-darwin/dist/releases/force-${{ env.VERSION }}-darwin-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: build/out-darwin/dist/releases/force-${{ env.VERSION }}-darwin-arm64.tar.gz*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: darwin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches pyproject.toml
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -qx "version = \"$v\"" pyproject.toml \
            || { echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml has $(grep -m1 '^version' pyproject.toml)"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "FORCE_BUILD_ROOT=$RUNNER_TEMP/build" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          sudo apt-get update -q && sudo apt-get install -yq tmux
          cargo fetch --locked --manifest-path crates/sidebar/Cargo.toml
          cargo fetch --locked --manifest-path crates/intro/Cargo.toml
          python -m pip install -q pytest && python -m pytest -q
      - name: The macOS tarball (its SHA goes into install.sh)
        uses: actions/download-artifact@v4
        with:
          name: darwin
          path: ${{ env.FORCE_BUILD_ROOT }}/dist/releases
      - name: Build the tarball and install.sh
        run: scripts/build-release.sh "$VERSION"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.FORCE_BUILD_ROOT }}/dist/releases/force-${{ env.VERSION }}-linux-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d="$FORCE_BUILD_ROOT/dist"
          gh release create "$GITHUB_REF_NAME" --title "Force $VERSION" --generate-notes --verify-tag \
            "$d"/releases/force-"$VERSION"-*.tar.gz "$d"/releases/force-"$VERSION"-*.tar.gz.sha256 \
            "$d/install.sh"
      - name: Put the new install.sh on the website
        env:
          GH_TOKEN: ${{ github.token }}
        # the website workflow runs on main: Pages publishes a deployment from main, not one from a tag
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
