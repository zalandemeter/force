# A pull request's title becomes its squashed commit on main, so it must be a Conventional Commit
# (CONTRIBUTING.md): type(optional scope)!: description
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-24.04
    steps:
      - name: Check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].{0,98}$'
          if printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "ok: $TITLE"
          else
            echo "::error::The title must be a Conventional Commit, such as 'fix(sidebar): stop the flicker on resize' (CONTRIBUTING.md). Got: $TITLE"
            exit 1
          fi
