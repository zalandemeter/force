# Tests on every push to main and every pull request: the Python package (with tmux, as Force runs it), the two
# Rust crates, and the website build; the package and the crates on macOS too (SPEC §51).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: tmux
        run: sudo apt-get update -q && sudo apt-get install -yq tmux
      - name: Rust crate sources (the notices test reads the dependency tree offline)
        run: |
          cargo fetch --locked --manifest-path crates/sidebar/Cargo.toml
          cargo fetch --locked --manifest-path crates/intro/Cargo.toml
      - run: python -m pip install -q pytest
      - run: python -m pytest -q

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/sidebar/target
            crates/intro/target
          key: rust-${{ runner.os }}-${{ hashFiles('crates/*/Cargo.lock') }}
      - name: Sidebar, header and dialog
        run: cargo test --locked --release --manifest-path crates/sidebar/Cargo.toml
      - name: Intro
        run: cargo test --locked --release --manifest-path crates/intro/Cargo.toml

  python-macos:
    name: Python 3.12 (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            build/out-darwin/cache
            build/src
          key: darwin-tmux-${{ hashFiles('scripts/build-darwin.sh') }}
      - name: Force's own tmux 3.4 (what it ships; Homebrew's is newer and behaves differently)
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          scripts/build-darwin.sh --tmux-only >> "$GITHUB_PATH"
      - name: Rust crate sources (the notices test reads the dependency tree offline)
        run: |
          cargo fetch --locked --manifest-path crates/sidebar/Cargo.toml
          cargo fetch --locked --manifest-path crates/intro/Cargo.toml
      - run: python -m pip install -q pytest
      - run: tmux -V && python -m pytest -q -p no:cacheprovider

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/sidebar/target
            crates/intro/target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/*/Cargo.lock') }}
      - name: Sidebar, header and dialog
        run: cargo test --locked --release --manifest-path crates/sidebar/Cargo.toml
      - name: Intro
        run: cargo test --locked --release --manifest-path crates/intro/Cargo.toml

  website:
    name: Website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python website/tools/build.py _site
      - name: Preview of the built site (pull requests; download it from the run's Artifacts)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: _site
          retention-days: 7
