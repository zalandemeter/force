[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "force"
version = "1.0.7"
description = "A tmux cockpit for AI coding agent sessions"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
force = "force.cli:main"

[tool.setuptools]
packages = ["force"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test the working tree, never the live release that the venv imports (force-live.pth).
pythonpath = ["."]
