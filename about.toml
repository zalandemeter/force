# cargo-about (scripts/notices.sh): licences accepted for crates compiled into Force's binaries. A crate whose
# licence is not in this list fails the notices build, so a new copyleft dependency cannot slip in unnoticed.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "0BSD",
    "WTFPL",
]
# the platforms Force ships for (Linux; macOS on Apple Silicon, SPEC §51): crates for other targets (Windows, wasm, UEFI) are not compiled in
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
